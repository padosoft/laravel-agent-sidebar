name: Agent Sidebar

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['^12.62', '^13.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pcntl
          tools: composer:v2
          coverage: none
      - run: composer update --with "laravel/framework:$LARAVEL_VERSION" --prefer-dist --no-interaction --no-progress
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
      - run: composer test
